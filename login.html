<html lang="en">

<head>
  <title>Login</title>

  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&display=swap"
    rel="stylesheet">
  <!-- Stylesheet -->
  <style media="screen">
    *,
    *:before,
    *:after {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    *::selection{
      background-color: #464646;
    }
    body {
      background: radial-gradient(circle at center, #222222, #000000);
    }

    .background {
      width: 430px;
      height: 520px;
      position: absolute;
      transform: translate(-50%, -50%);
      left: 50%;
      top: 50%;
    }

    .background .shape {
      height: 200px;
      width: 200px;
      position: absolute;
      border-radius: 50%;
    }

    .shape:first-child {
      background: linear-gradient(#222222,
          #222222);
      left: -80px;
      top: -80px;
    }

    .shape:last-child {
      background: linear-gradient(to right,
          #222222,
          #222222);
      right: -30px;
      bottom: -80px;
    }

    form {
      height: 480px;
      width: 400px;
      background: none;
      position: absolute;
      transform: translate(-50%, -50%);
      top: 50%;
      left: 50%;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 40px rgba(8, 7, 16, 0.6);
      padding: 50px 35px;
    }

    form * {
      font-family: 'Poppins', sans-serif;
      color: #000000;
      letter-spacing: 0.5px;
      outline: none;
      border: none;
    }

    form h3 {
      font-size: 50px;
      font-weight: 500;
      line-height: 42px;
      text-align: center;
      font-family: "Bitcount Prop Single", system-ui;
      font-optical-sizing: auto;
      font-weight: 23px;
      font-style: normal;
      font-variation-settings:
        "slnt" 0,
        "CRSV" 0.5,
        "ELSH" 0,
        "ELXP" 0;
    }
    label {
      display: block;
      margin-top: 30px;
      font-size: 16px;
      font-weight: 500;
    }

    input {
      display: block;
      height: 50px;
      width: 100%;
      background-color: rgba(255, 255, 255, 0.07);
      border-radius: 3px;
      padding: 0 10px;
      margin-top: 8px;
      font-size: 14px;
      font-weight: 300;
    }

    ::placeholder {
      color: #000000;
    }

    button {
      margin-top: 50px;
      width: 100%;
      background: radial-gradient(circle at center, #222222, #000000);
      color: #000000;
      padding: 15px 0;
      font-size: 18px;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
    }

    .social {
      margin-top: 30px;
      display: flex;
    }

    .social div {
      background: red;
      width: 150px;
      border-radius: 3px;
      padding: 5px 10px 10px 5px;
      background-color: rgba(255, 255, 255, 0.27);
      color: #eaf0fb;
      text-align: center;
    }

    .social div:hover {
      background-color: rgba(255, 255, 255, 0.47);
    }

    .social .fb {
      margin-left: 25px;
    }

    .social i {
      margin-right: 4px;
    }

    input:focus {
      border-bottom: 2px solid black;
      height: 52px;
    }


    .input-container {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .input-container:hover input[type="text"] {
      border-bottom: 2px solid rgba(255, 255, 255, 0.14);
    }

    .input-container:hover input[type="password"] {
      border-bottom: 2px solid rgba(255, 255, 255, 0.14);
    }

    .input-container input[type="text"] {
      border: none;
      border-bottom: 2px solid rgba(255, 255, 255, 0.07);
      outline: none;
      padding: 15px;
      width: 100%;
    }

    .input-container input[type="password"] {
      border: none;
      border-bottom: 2px solid rgba(255, 255, 255, 0.07);
      outline: none;
      padding: 15px;
      width: 100%;
    }

    .underline {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background-color: #000000;
      transition: width 0.3s ease-in-out;
    }

    .input-container input[type="text"]:focus+.underline {
      width: 100%;
    }

    .input-container input[type="password"]:focus+.underline {
      width: 100%;
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="shape"></div>
    <div class="shape"></div>
  </div>
  <form>
    <h3>Login Here</h3>

    <label for="username">Username</label>
    <div class="input-container">
      <input type="text" placeholder="Username" id="username">
      <span class="underline"></span>
    </div>

    <label for="password">Password</label>
    <div class="input-container">
      <input type="password" placeholder="Password" id="password">
      <span class="underline"></span>
    </div>

    <button>Log In</button>
  </form>
  
</body>

</html>
