<html lang="en">

<head>
  <title>Login</title>

  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&display=swap"
    rel="stylesheet">
  <!-- Stylesheet -->
  <style media="screen">
    *,
*:before,
*:after {
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}

*::selection {
  background-color: #555;
}

body {
  background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1d 100%);
  min-height: 100vh;
  font-family: 'Poppins', sans-serif;
}

.background {
  width: 430px;
  height: 520px;
  position: absolute;
  transform: translate(-50%, -50%);
  left: 50%;
  top: 50%;
}

.background .shape {
  height: 200px;
  width: 200px;
  position: absolute;
  border-radius: 50%;
  filter: blur(20px);
  opacity: 0.6;
}

.shape:first-child {
  background: linear-gradient(135deg, #6b48ff, #00ddeb);
  left: -80px;
  top: -80px;
}

.shape:last-child {
  background: linear-gradient(135deg, #ff6b6b, #ffa62b);
  right: -30px;
  bottom: -80px;
}

form {
  height: 480px;
  width: 400px;
  background: rgba(20, 20, 35, 0.65);
  position: absolute;
  transform: translate(-50%, -50%);
  top: 50%;
  left: 50%;
  border-radius: 16px;
  backdrop-filter: blur(12px) saturate(160%);
  -webkit-backdrop-filter: blur(12px) saturate(160%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
  padding: 50px 35px;
}

form * {
  font-family: 'Poppins', sans-serif;
  color: #e0e0ff;
  letter-spacing: 0.4px;
  outline: none;
  border: none;
}

form h3 {
  font-size: 50px;
  font-weight: 500;
  line-height: 42px;
  text-align: center;
  font-family: "Bitcount Prop Single", system-ui;
  color: #f0f0ff;
  margin-bottom: 10px;
}

label {
  display: block;
  margin-top: 30px;
  font-size: 16px;
  font-weight: 500;
  color: #c0c0ff;
}

input {
  display: block;
  height: 50px;
  width: 100%;
  background-color: rgba(40, 40, 60, 0.5);
  border-radius: 8px;
  padding: 0 14px;
  margin-top: 8px;
  font-size: 15px;
  font-weight: 300;
  color: #f0f0ff;
  border: 1px solid rgba(100, 100, 140, 0.3);
  transition: all 0.25s ease;
}

::placeholder {
  color: #a0a0c0;
}

button {
  margin-top: 50px;
  width: 100%;
  background: linear-gradient(90deg, #6b48ff, #00d4ff);
  color: white;
  padding: 15px 0;
  font-size: 18px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  border: none;
  transition: all 0.3s ease;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(80, 100, 255, 0.4);
}

.input-container {
  position: relative;
  display: block;
  width: 100%;
}

.input-container input[type="text"],
.input-container input[type="password"] {
  border: none;
  border-bottom: 2px solid rgba(100, 120, 255, 0.3);
  border-radius: 0;
  background: transparent;
  padding: 15px 0 8px 0;
  color: #f0f0ff;
}

.input-container input[type="text"]:focus,
.input-container input[type="password"]:focus {
  border-bottom: 2px solid #6b48ff;
}

.underline {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0;
  height: 2px;
  background: linear-gradient(to right, #6b48ff, #00d4ff);
  transition: width 0.35s ease;
}

.input-container input:focus + .underline {
  width: 100%;
}
  </style>
</head>

<body>

  <div class="background">
    <div class="shape"></div>
    <div class="shape"></div>
  </div>
  <form>
    <h3>Login Here</h3>

    <label for="username">Username</label>
    <div class="input-container">
      <input type="text" placeholder="Username" id="username">
      <span class="underline"></span>
    </div>

    <label for="password">Password</label>
    <div class="input-container">
      <input type="password" placeholder="Password" id="password">
      <span class="underline"></span>
    </div>

    <button>Log In</button>
  </form>
  
</body>

</html>
